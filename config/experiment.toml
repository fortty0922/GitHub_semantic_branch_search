[corpus.dedup]
min_tokens = 20
shingle_size = 5
num_perm = 128
threshold = 0.9
min_english_ratio = 0.5
max_group_size = 10
keep_star_ratio = 10.0

[corpus.labels]
target_precision = 0.9
min_support = 50
cv_folds = 5
seed = 20261126
other_min_topics = 3
max_features = 50000
min_df = 2
C = 1.0

[corpus.split]
test_fraction = 0.1
sources = ["topic", "awesome", "manual"]
seed = 20261126

[paths]
test_set = "data/test_set.json"
manual_labels = "data/manual/labels.csv"
manual_exclude = "data/manual/exclude.csv"

[crawler.domain]
target_per_domain = 20000
